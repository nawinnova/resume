# jazznotes.io
- project: Postdoctoral Research - PROBA-3/ASPIICS Operation and Scientific Tasks
  # role: Founder & Primary Developer
  duration: 2025 &mdash; Present
  description: >- 
    My main task involves analysis of incoming imaging data from the ASPIICS coronagraph onboard the PROBA-3 satellite pairs. 
    Based on this analysis, optimal exposure times and improved schemes for the tiling of the images onboard the instrument will be suggested to combine different exposure times into one single image. 
    I also aim to study the structure and dynamics of the coronal structures and pursue research by combining the ASPIICs coronagraph images with data from Solar Orbiter and other facilities 
    to relate the structure and dynamics seen in remote sensing to in situ data.

- project: PhD Research - Investigating the Evolution of Solar Open Magnetic Field Regions
  # role: Founder & Primary Developer
  duration: 2021 &mdash; 2025
  description: >- 
    The magnetic connection between the Earth and the Sun can be traced back to ``open magnetic field regions`` in the solar atmosphere. 
    Their extended magnetic field configuration allows coronal plasma to escape as the solar wind through which solar eruptive events can propagate.  
    In this research, remote sensing observations from several spacecraft along with coronal magnetic field models are used to explore various configurations of open magnetic field regions and their evolution, with the main focus on identifying the driving mechanisms behind these evolutionary changes. 
    Investigating the nature, evolution, and dynamics of open magnetic field regions will greatly contribute towards answering the long-standing questions in heliospheric physics, including the origins of the solar wind and the influence of solar activity on the space environment. 
    Consequently, this knowledge will also improve the capability of space weather forecasting and the understanding of the interaction between the Sun and solar system bodies.
    
  publications: 
    - publication: Ngampoopun, N., Long, D. M., Green, L. M., Yardley, S. L., James, A. W., Mason, E. I., ... & Uritsky, V. M. (2026). Investigating the Relationship Between Physical Properties and Spatial Irregularities at Coronal Hole Boundaries. Solar Physics, 301(5), 75.
    - publication: Ngampoopun, N., Susino, R., Brooks, D. H., Lionello, R., Abbo, L., Spadaro, D., ... & Russano, G. (2025). Investigating Solar Wind Outflows from Open–Closed Magnetic Field Structures Using Coordinated Solar Orbiter and Hinode Observations. Solar Physics, 300(4), 45.
    - publication: Ngampoopun, N., Long, D. M., Baker, D., Green, L. M., Yardley, S. L., James, A. W., & To, A. S. (2023). The Merging of a Coronal Dimming and the Southern Polar Coronal Hole. The Astrophysical Journal, 950(2), 150.
    - publication: Green, L. M., James, A. W., Ngampoopun, N., Yardley, S. L., Waite, K., Mottram, E. K., ... & Okane, J. (2026). Identifying and predicting coronal mass ejection occurrence: Observational checklists for space weather forecasters. Space Weather, 24(6)
    - publication: Yardley, S.L. et al. including Ngampoopun, N. (2024). Multi-source connectivity as the driver of solar wind variability in the heliosphere. Nature Astronomy, 8(8), 953.
    - publication: Yardley, S.L. et al. including Ngampoopun, N. (2023). Slow Solar Wind Connection Science during Solar Orbiter’s First Close Perihelion Passage.The Astrophysical Journal Supplement Series, 267(1), 11.
    - publication: Long, D. M., Chitta, L. P., Baker, D., Hannah, I. G., Ngampoopun, N., Berghmans, D., ... & Teriaca, L. (2023). Multi-stage reconnection powering a solar coronal jet. The Astrophysical Journal, 944, 19.


# Springfield Community Outreach Group
# - project: Analysis of Turbulence Energy Transfer at an Interplanetary Shock Observed by the Magnetospheric Multiscale Mission
#   # role: Co-Founder & Organizer
#   duration: 2021 &mdash; Present
#   # url: "#"
#   description: >- 
#     In this work, we examine burst-mode observations by the Magnetospheric Multiscale Mission (MMS)
#     for an interplanetary shock passage on 8 January 2018. We use a Kolmogorov-Yaglom Law for the
#     third-order structure function and a von Karman-decay law to calculate the energy dissipation rates
#     at the inertial scale and energy-containing scale, respectively. The results show that the downstream
#     region of the shock has stronger and better-developed turbulence and a higher energy transfer rate than
#     the upstream region.

- project: Undergraduate Senior Project - Domains of Magnetic Pressure Balance in Parker Solar Probe Observations of the Solar Wind
  # role: Co-Founder & Organizer
  duration: 2020 &mdash; 2021
  # url: "#"
  description: >- 
    This research investigated the domains of nearly constant magnetic field magnitude as observed from
    the Parker Solar Probe (PSP). The study used data from the first five solar encounters of PSP and
    analyzed these domains in various aspects, such as statistical distribution, relation with plasma beta
    and aspect ratio of domains. The results showed that an inverse association between the mean domain
    duration and plasma β and the domain duration relates to the waiting time between events that disrupt
    the near constancy of |B|, many of which are switchbacks.
  publications: 
    - publication: Ruffolo, D., Ngampoopun, N., Bhora, Y. R., Thepthong, P., Pongkitiwanichakul, P., Matthaeus, W. H., & Chhiber, R. (2021). Domains of Magnetic Pressure Balance in Parker Solar Probe Observations of the Solar Wind. The Astrophysical Journal, 923(2), 158.
    
